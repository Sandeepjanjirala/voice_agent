[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telugu-ai-calling-agent"
version = "0.1.0"
description = "Vaani universal voice-agent workspace: LiveKit Agents voice worker + Django backend (separate processes)"
requires-python = ">=3.11, <3.14"

dependencies = [
    # Lightweight shared configuration + LiveKit control-plane client.
    "python-dotenv",
    "livekit-api~=1.2",
]

[dependency-groups]
# Production images select exactly one runtime group. A normal `uv run` keeps
# both processes and development tools available for the existing test suite.
voice = [
    "livekit-agents[sarvam,openai]~=1.8",
    "livekit-plugins-ai-coustics~=0.3",
]
backend = [
    "django~=5.2",
    "djangorestframework~=3.16",
    "dj-database-url~=3.0",
    "psycopg[binary]~=3.2",
    "cryptography>=50,<51",
    "celery[redis]>=5.5,<6",
    "gunicorn>=23,<24",
    "whitenoise>=6.8,<7",
    # Call recordings in private S3-compatible storage (apps/calling/recordings.py).
    "boto3>=1.35,<2",
    # Excel (.xlsx) lists of numbers to call (apps/calling/calllists.py).
    "openpyxl>=3.1,<4",
    "langgraph>=1.0,<2",
]

dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-django",
    "ruff",
]

[tool.uv]
default-groups = ["backend", "voice", "dev"]
# Security floor for the HTTP client shared by LiveKit's control-plane and voice
# runtimes. Its yarl>=1.25.1 dependency has supported Python 3.12 wheels.
constraint-dependencies = [
    "aiohttp>=3.14.4",
    # 18.1.0 was yanked for audio-decoder memory corruption (Python 3.11 branch).
    "av!=18.1.0",
]

[tool.setuptools.packages.find]
include = ["voice_agent*", "apps*", "config*", "dialing*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
DJANGO_SETTINGS_MODULE = "tests.django_settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "RUF001",  # Telugu text in prompts trips the ambiguous-character checks
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
