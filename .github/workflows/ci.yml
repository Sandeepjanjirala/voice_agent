name: Lint and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vaani_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vaani_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgres://postgres:ci-only-password@127.0.0.1:5432/vaani_ci' || '' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.9"

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: UV_GIT_LFS=1 uv sync --locked --dev

    - name: Run ruff linter
      run: uv run --no-sync ruff check --output-format=github .

    - name: Run ruff formatter
      run: uv run --no-sync ruff format --check --diff .

    - name: Run tests
      run: uv run --no-sync python -m pytest

  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check deployment shell syntax
      run: |
        while IFS= read -r -d '' file; do
          bash -n "$file"
        done < <(find scripts deploy -name '*.sh' -print0)
    - name: ShellCheck deployment scripts
      run: shellcheck -x scripts/*.sh scripts/lib/*.sh deploy/*.sh
    - name: Test isolated Nginx configuration and rollback
      run: bash tests/deployment/test_nginx.sh
