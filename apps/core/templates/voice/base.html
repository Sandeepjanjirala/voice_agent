{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Telugu AI Calling Agent · Voice studio</title>
  <link rel="stylesheet" href="{% static 'voice/studio.css' %}">
</head>
<body>
  <header class="topbar"><a class="brand" href="{% url 'voice' %}"><span class="brand-icon" aria-hidden="true">తె</span><span>Telugu AI<span class="brand-sub">CALLING AGENT</span></span></a>
    <div class="top-actions"><span class="pill">Voice studio</span>{% if user.is_authenticated %}<form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="text-button">Sign out</button></form>{% endif %}</div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Telugu AI Calling Agent <span>Built for conversations that feel natural.</span></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
