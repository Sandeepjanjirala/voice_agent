# Local PostgreSQL for development only; reachable from this machine alone.
#
#   docker compose --env-file .env.local up -d      # start
#   docker compose --env-file .env.local down       # stop (data is kept)
#
# Needs POSTGRES_PASSWORD in .env.local. Then point Django at it with
# DATABASE_URL=postgres://telugu_agent:<password>@127.0.0.1:5432/telugu_agent
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telugu_agent
      POSTGRES_USER: telugu_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telugu_agent -d telugu_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
